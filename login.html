<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicio de sesión para doctores.">
    <title>Historialito | Iniciar sesión</title>
    <link rel="stylesheet" href="css/materialize.css">
</head>

<body class="blue lighten-5">
    <header>
        <nav class="indigo darken-4" aria-label="Navegación principal">
            <div class="nav-wrapper container">
                <a href="login.html" class="brand-logo">Historialito</a>
            </div>
        </nav>
    </header>

    <main class="container section">
        <div class="row">
            <div class="col s12 m8 offset-m2 l6 offset-l3">
                <h1 class="indigo-text text-darken-4">Iniciar sesión</h1>
                <p class="flow-text black-text">Solo para doctores registrados.</p>

                <form id="form-login" class="card-panel white">
                    <div class="input-field">
                        <input id="correo" name="correo" type="email" required>
                        <label for="correo">Correo</label>
                    </div>
                    <div class="input-field">
                        <input id="clave" name="clave" type="password" required>
                        <label for="clave">Contraseña</label>
                    </div>
                    <p id="error-login" class="red-text"></p>
                    <div class="right-align">
                        <button class="btn indigo darken-4 white-text" type="submit">Entrar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="page-footer indigo darken-4 white-text">
        <div class="container">
            <p>Historialito — Un registro ordenado ayuda a cuidar mejor</p>
        </div>
        <div class="footer-copyright">
            <div class="container">Proyecto escolar — Datos ficticios</div>
        </div>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
